; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; Each env picks a config folder with -Isrc/configs/<name>: its layout.h
; (outputs, zones, fixtures) and anims.h (animation list).

[platformio]
default_envs = folle

; Settings shared by every env
[env]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 115200
monitor_filters =
	esp32_exception_decoder
board_build.partitions = default.csv

lib_deps =
	Adafruit NeoPixel
	fastled/FastLED@3.9.16

; DMX2LEDs V4 board pinout
[board_v4]
build_flags =
	; LED outputs (the config's layout.h decides which ones are used)
	-D LED_PIN_1=23
	-D LED_PIN_2=22
	-D LED_PIN_3=21
	-D LED_PIN_4=19
	-D LED_PIN_5=18
	-D LED_PIN_6=5
	-D LED_PIN_7=4
	-D LED_PIN_8=0

	; DIP switches: DIP_PIN_0-8 = DMX address bits 0-8, DIP_PIN_9 (switch 10)
	; ON at power-up = DMX over ESP-NOW + WizMote remote (src/espnow_input.cpp)
	-D DIP_PIN_0=14
	-D DIP_PIN_1=27
	-D DIP_PIN_2=26
	-D DIP_PIN_3=25
	-D DIP_PIN_4=33
	-D DIP_PIN_5=32
	-D DIP_PIN_6=35
	-D DIP_PIN_7=34
	-D DIP_PIN_8=39
	-D DIP_PIN_9=36

	; DMX transceiver
	-D DMX_SERIAL_INPUT_PIN=16
	-D DMX_SERIAL_OUTPUT_PIN=17
	-D DMX_SERIAL_IO_PIN=15

	; Status LED: on while a valid DMX signal is received
	-D LED_STATUS_PIN=12

	-D OTA_PASSWORD=\"${ota.password}\"

; WiFi update mode (src/ota.cpp): hold fixture 1 at R=42 G=43 B=44, dim 0, for
; 5 s, join its network (<DEVICE_NAME>-<address>), then upload any env with
;   pio run -e <env> -t upload --upload-port 4.3.2.1
; or open http://4.3.2.1 in a browser.
[ota]
password = dmx2leds ; WiFi network password, 8 characters minimum

; ---- FOLLE sign (src/configs/folle) ------------------------------------

[env:folle]
build_flags =
	${board_v4.build_flags}
	-Isrc/configs/folle

; ---- All WS2812FX effects (src/configs/allfx) -------------------------
; Generic outputs, but every WS2812FX effect: the DMX anim value is the
; effect id (0 static ... 55 twinklefox, 56 off, 57 snake).
[allfx]
build_flags =
	${board_v4.build_flags}
	-Isrc/configs/allfx

[env:allfx_1x_60]
build_flags = ${allfx.build_flags} -D LED_COUNT=60

; ---- LED preview (bench) ----------------------------------------------
; *_preview envs add an LED preview on the USB serial port: the LEDs are
; drawn on the PC with  scripts/led_view.py /dev/ttyUSB0
; The real outputs keep working. Not for installations: the log is mixed
; with binary frames, `pio device monitor` shows garbage.
[preview]
build_flags =
	-D LED_PREVIEW
	-D SERIAL_BAUD=921600

[env:folle_preview]
build_flags = ${env:folle.build_flags} ${preview.build_flags}
monitor_speed = 921600

; ---- Generic (src/configs/generic) -------------------------------------
; LED_COUNT is the number of LEDs per output.

; One output (LED_PIN_1), one 6-channel DMX block
[generic]
build_flags =
	${board_v4.build_flags}
	-Isrc/configs/generic

[env:generic_1x_60]
build_flags = ${generic.build_flags} -D LED_COUNT=60

[env:generic_1x_480]
build_flags = ${generic.build_flags} -D LED_COUNT=480

[env:generic_1x_960]
build_flags = ${generic.build_flags} -D LED_COUNT=960

[env:generic_1x_2048]
build_flags = ${generic.build_flags} -D LED_COUNT=2048

; 8 outputs, each with its own 6-channel DMX block (output 1 at the
; address, output 2 at +6, ... 48 channels in total)
[generic_8x]
build_flags =
	${generic.build_flags}
	-D MULTI_OUTPUT
	; 1 RMT memory block per output, so all 8 outputs send at once (FastLED's
	; default of 2 blocks only gives 4 channels: outputs 5-8 would wait)
	-D FASTLED_RMT_MEM_BLOCKS=1

[env:generic_8x_480]
build_flags = ${generic_8x.build_flags} -D LED_COUNT=480

[env:generic_8x_960]
build_flags = ${generic_8x.build_flags} -D LED_COUNT=960

[env:generic_8x_2048]
build_flags = ${generic_8x.build_flags} -D LED_COUNT=2048

[env:generic_1x_60_preview]
build_flags = ${env:generic_1x_60.build_flags} ${preview.build_flags}
monitor_speed = 921600

[env:allfx_1x_60_preview]
build_flags = ${env:allfx_1x_60.build_flags} ${preview.build_flags}
monitor_speed = 921600
